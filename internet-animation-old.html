<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Animation</title>
  <style>
    /* ---------- CSS: the design ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background: radial-gradient(circle at center, #0b1a3a 0%, #020617 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #e0f2fe;
    }

    canvas { display: block; }

    h1 {
      position: absolute;
      bottom: 8%;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 12px #38bdf8, 0 0 30px #0ea5e9;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }
  </style>
</head>
<body>

  <!-- ---------- HTML: the structure ---------- -->
  <canvas id="net"></canvas>
  <h1>Connected World</h1>

  <script>
    /* ---------- JavaScript: the animation ---------- */
    const canvas = document.getElementById("net");
    const ctx = canvas.getContext("2d");

    let W, H, R, cx, cy;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W / 2;
      cy = H / 2.2;
      R = Math.min(W, H) * 0.3;          // globe radius
    }
    window.addEventListener("resize", resize);
    resize();

    // 1. Create points spread evenly on a sphere (these are "servers / devices")
    const NODES = 70;
    const nodes = [];
    for (let i = 0; i < NODES; i++) {
      const y = 1 - (i / (NODES - 1)) * 2;     // from 1 to -1
      const r = Math.sqrt(1 - y * y);
      const theta = i * 2.39996;               // golden angle
      nodes.push({ x: Math.cos(theta) * r, y: y, z: Math.sin(theta) * r });
    }

    // 2. Connect each node to its 2 nearest neighbours (network links)
    const links = [];
    nodes.forEach((a, i) => {
      const nearest = nodes
        .map((b, j) => ({ j, d: (a.x-b.x)**2 + (a.y-b.y)**2 + (a.z-b.z)**2 }))
        .filter(o => o.j !== i)
        .sort((p, q) => p.d - q.d)
        .slice(0, 2);
      nearest.forEach(o => links.push([i, o.j]));
    });

    // 3. Data packets that travel along links
    const packets = [];
    function newPacket() {
      const link = links[Math.floor(Math.random() * links.length)];
      packets.push({ link, t: 0, speed: 0.008 + Math.random() * 0.012 });
    }
    for (let i = 0; i < 25; i++) newPacket();

    // Rotate a 3D point around the Y axis, then project to 2D
    function project(p, angle) {
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const x = p.x * cos - p.z * sin;
      const z = p.x * sin + p.z * cos;
      const tilt = 0.35;                       // slight tilt for a nicer view
      const y = p.y * Math.cos(tilt) - z * Math.sin(tilt);
      const z2 = p.y * Math.sin(tilt) + z * Math.cos(tilt);
      return { sx: cx + x * R, sy: cy + y * R, z: z2 };
    }

    // Background stars
    const stars = Array.from({ length: 150 }, () => ({
      x: Math.random(), y: Math.random(), s: Math.random() * 1.5, p: Math.random() * 6
    }));

    let angle = 0;
    function draw(time) {
      ctx.clearRect(0, 0, W, H);

      // Twinkling stars
      stars.forEach(s => {
        ctx.globalAlpha = 0.4 + 0.4 * Math.sin(time / 600 + s.p);
        ctx.fillStyle = "#fff";
        ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
      });
      ctx.globalAlpha = 1;

      // Globe glow
      const glow = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.3);
      glow.addColorStop(0, "rgba(56,189,248,0.15)");
      glow.addColorStop(1, "rgba(56,189,248,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, R * 1.3, 0, Math.PI * 2);
      ctx.fill();

      // Globe outline
      ctx.strokeStyle = "rgba(56,189,248,0.35)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();

      const pts = nodes.map(n => project(n, angle));

      // Links (front ones brighter than back ones)
      links.forEach(([a, b]) => {
        const p = pts[a], q = pts[b];
        const depth = (p.z + q.z) / 2;
        ctx.strokeStyle = `rgba(125,211,252,${depth > 0 ? 0.5 : 0.12})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.sx, p.sy);
        ctx.lineTo(q.sx, q.sy);
        ctx.stroke();
      });

      // Nodes
      pts.forEach(p => {
        const front = p.z > 0;
        ctx.fillStyle = front ? "#7dd3fc" : "rgba(125,211,252,0.3)";
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, front ? 3 : 1.8, 0, Math.PI * 2);
        ctx.fill();
      });

      // Moving data packets
      for (let i = packets.length - 1; i >= 0; i--) {
        const pk = packets[i];
        pk.t += pk.speed;
        if (pk.t >= 1) { packets.splice(i, 1); newPacket(); continue; }
        const p = pts[pk.link[0]], q = pts[pk.link[1]];
        const x = p.sx + (q.sx - p.sx) * pk.t;
        const y = p.sy + (q.sy - p.sy) * pk.t;
        ctx.shadowColor = "#facc15";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#fde047";
        ctx.beginPath();
        ctx.arc(x, y, 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      angle += 0.004;                          // rotation speed
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
